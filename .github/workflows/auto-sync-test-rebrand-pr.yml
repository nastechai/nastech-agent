name: Auto Sync Test Rebrand PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [upstream-update]
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-test-rebrand-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Updates repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/nastechai/nastech-agent.git || true
          git fetch upstream --depth=50

      - name: Add target remote
        env:
          NAS_TOKEN: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Use NAS_TOKEN if available, otherwise fallback to GITHUB_TOKEN
          git remote add target https://nastechai:${NAS_TOKEN}@github.com/nastechai/nastech-agent.git || true
          git fetch target --depth=50

      - name: Get upstream HEAD
        id: upstream-info
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          SHORT_SHA=${UPSTREAM_SHA:0:8}
          UPSTREAM_MSG=$(git log upstream/main -1 --pretty=format:"%s" | tr -d '"' | tr -d "'")
          echo "sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "message=$UPSTREAM_MSG" >> $GITHUB_OUTPUT

      - name: Check if already synced
        id: check-sync
        run: |
          if git log --oneline | grep -q "${{ steps.upstream-info.outputs.short_sha }}"; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          BRANCH_NAME="sync/$(date +%Y%m%d-%H%M%S)-${{ steps.upstream-info.outputs.short_sha }}"
          git checkout -b "$BRANCH_NAME"
          echo "SYNC_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Merge upstream changes
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          git merge upstream/main --no-commit --no-ff || true
          # Preserve our own workflows
          git checkout HEAD -- .github/workflows/

      - name: Apply branding transformations
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          chmod +x .github/scripts/rebrand.sh
          .github/scripts/rebrand.sh . false

      - name: Verify branding compliance
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          chmod +x .github/scripts/verify-branding.sh
          .github/scripts/verify-branding.sh .

      - name: Commit changes
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          git add -A
          git commit -m "chore: sync and rebrand from NasTech

          Upstream: main@${{ steps.upstream-info.outputs.short_sha }}
          Message: ${{ steps.upstream-info.outputs.message }}
          
          Automated by: NasTech Sync Bot"

      - name: Push sync branch to target repo
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          # Push to the target repository (nastech-agent)
          git push target "${{ env.SYNC_BRANCH }}" --force

      - name: Create PR in nastech-agent
        if: steps.check-sync.outputs.already_synced == 'false'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const syncBranch = '${{ env.SYNC_BRANCH }}';
            const shortSha = '${{ steps.upstream-info.outputs.short_sha }}';
            
            await github.rest.pulls.create({
              owner: 'nastechai',
              repo: 'nastech-agent',
              title: `chore: sync and rebrand from NasTech (${shortSha})`,
              head: syncBranch,
              base: 'main',
              body: `## Sync and Rebrand from NasTech\n\n**Upstream:** \`main@${shortSha}\`\n\nThis PR was automatically generated and verified by the NasTech Sync Bot from the Updates repository.`
            });

  handle-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [sync-test-rebrand-pr]
    steps:
      - name: Create failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Auto Sync Workflow Failed',
              body: 'The sync and rebrand workflow failed. Please check the workflow logs in the Updates repository.'
            });
